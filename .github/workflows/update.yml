name: Update CAMS data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7 * * *"

permissions:
  contents: write

concurrency:
  group: cams-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Retrieve and validate CAMS data
        env:
          CAMS_ADS_TOKEN: ${{ secrets.CAMS_ADS_TOKEN }}
        run: python producer.py --output data/latest.json
      - name: Publish last good JSON
        run: |
          if git diff --quiet -- data/latest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update CAMS forecast"
          git push
